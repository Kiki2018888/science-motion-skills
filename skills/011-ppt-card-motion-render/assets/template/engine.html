<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:CardSans;src:url(body.otf);font-weight:400;font-display:block}
*{font-family:CardSans,sans-serif!important}

*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden}
body{font-family:Inter,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;background:var(--stage);color:var(--ink);-webkit-font-smoothing:antialiased}
#root{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--stageBg,var(--stage))}
.streak{position:absolute;width:260px;height:1800px;top:-400px;transform-origin:center;filter:blur(40px);opacity:var(--streakO,.5)}
.scene{position:absolute;inset:0;display:none}
.prog{position:absolute;left:120px;right:120px;top:54px;display:flex;gap:18px;z-index:5}
.prog .seg{flex:1;font:600 15px Inter;color:var(--sub);letter-spacing:.05em}
.prog .bar{height:3px;border-radius:3px;background:var(--line);margin-bottom:10px;overflow:hidden}
.prog .fill{height:100%;width:0;background:var(--accent2)}
.prog .seg.on{color:var(--accentText)}
/* text column */
.txt{position:absolute;top:150px;width:640px}
.ghost{font:900 150px/1 Inter;color:var(--ghost);letter-spacing:-.03em;margin-left:-6px}
.tag{display:flex;align-items:center;gap:14px;margin-top:6px;font:700 22px Inter;letter-spacing:.22em;color:var(--accentText)}
.tag i{display:block;width:5px;height:30px;background:var(--accent2);border-radius:3px}
.l1,.l2{font-weight:900;font-size:80px;line-height:1.18;letter-spacing:-.01em;white-space:nowrap}
.l1{margin-top:22px;color:var(--ink)}
.l2{color:var(--accentText);padding-left:48px;position:relative;display:inline-block}
.ul{position:absolute;left:48px;right:0;bottom:-4px;height:7px;border-radius:4px;background:var(--accent2)}
.note{margin-top:46px;font:500 26px/1.6 sans-serif;color:var(--sub);max-width:600px}
.bul{margin-top:40px;display:flex;flex-direction:column;gap:18px}
.bul div{font:600 30px/1.3 sans-serif;display:flex;gap:16px;align-items:center}
.bul b{width:12px;height:12px;border-radius:50%;background:var(--accent2);flex:none}
.sw{display:flex;gap:26px;margin-top:44px}
.sw .c{width:96px;height:62px;border-radius:12px;border:2px solid var(--line)}
.sw .p{font:800 32px Inter;margin-top:12px;color:var(--accentText)}
.sw .n{font:600 18px sans-serif;color:var(--sub);margin-top:2px}
/* card stage */
.cwrap{position:absolute;top:170px;width:1040px;height:680px;perspective:2200px}
.ctilt{width:100%;height:100%;transform:rotateY(var(--tilt,-7deg)) rotateX(3deg);transform-style:preserve-3d}
.cap{position:absolute;left:0;right:0;bottom:56px;height:72px;display:flex;justify-content:center;z-index:6}
.cap span{position:absolute;bottom:0;padding:14px 34px;border-radius:999px;background:var(--capBg);color:#fff;font:700 32px sans-serif;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.cap em{font-style:normal;color:var(--capKey)}
/* ---------- card (UI) ---------- */
.card{position:relative;width:1040px;height:680px;border-radius:var(--cr);background:var(--cardBg);box-shadow:var(--cshadow);display:flex;gap:var(--gap);padding:var(--cpad);font-size:15px;color:var(--cInk)}
.card .main{flex:1;display:flex;flex-direction:column;gap:var(--gap);min-width:0}
.side{width:64px;border-radius:calc(var(--r) + 4px);background:var(--sideBg);display:flex;flex-direction:column;align-items:center;gap:18px;padding-top:22px}
.side i{width:22px;height:22px;border-radius:7px;background:var(--sideIco)}
.side i.on{background:var(--accent)}
.hd{display:flex;align-items:center;gap:14px;min-height:54px}
.hd h3{font:800 26px Inter,sans-serif;letter-spacing:-.01em}
.hd .sub{color:var(--cSub);font-size:15px;margin-top:3px}
.hd .sp{flex:1}
.pill{padding:9px 18px;border-radius:999px;background:var(--tile);border:1px solid var(--tileLine);font-weight:600;font-size:14px;color:var(--cSub)}
.pill.on{background:var(--accent);color:var(--onAccent);border-color:transparent}
.btn{padding:12px 22px;border-radius:999px;background:var(--solid);color:#fff;font-weight:700;font-size:14px}
.kpis{display:flex;gap:var(--gap)}
.tile{position:relative;background:var(--tile);border:1px solid var(--tileLine);border-radius:var(--r);padding:20px 22px;min-width:0}
.k{flex:1;display:flex;flex-direction:column;gap:8px}
.k .lb{font-weight:600;color:var(--cSub);font-size:15px}
.k .v{font:800 40px Inter;letter-spacing:-.02em;color:var(--cInk)}
.k .d{align-self:flex-start;padding:4px 10px;border-radius:999px;font:700 13px Inter;background:var(--chip);color:var(--chipInk)}
.row2{flex:1;display:flex;gap:var(--gap);min-height:0}
.ch{flex:1.9;display:flex;flex-direction:column}
.ch .t,.ls .t{font-weight:700;font-size:16px;margin-bottom:10px}
.bars{flex:1;display:flex;align-items:flex-end;gap:10px;padding-top:10px}
.bars .b{flex:1;border-radius:var(--barR);background:var(--bar);height:50%}
.bars .b.hl{background:var(--accent)}
.ls{flex:1;display:flex;flex-direction:column;gap:12px}
.ls .r{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--tileLine)}
.ls .r:last-child{border:none}
.ls .r i{width:30px;height:30px;border-radius:9px;background:var(--chip);flex:none}
.ls .r .tt{flex:1;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ls .r .m{font:600 13px Inter;color:var(--cSub)}
.ph{display:flex;gap:var(--gap);height:200px}
.ph .p{flex:1;border-radius:var(--r);background-size:cover;background-position:center;position:relative;overflow:hidden;border:none}
.ph .p span{position:absolute;left:14px;bottom:12px;color:#fff;font:700 17px Inter,sans-serif;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.txtc{font:500 22px/1.65 sans-serif;color:var(--cInk)}
svg.ln{flex:1;width:100%}
/* wire overlay */
.wire{position:absolute;inset:0;border-radius:var(--cr);background:var(--wireBg);display:flex;gap:16px;padding:var(--cpad);z-index:3}
.wire .main{flex:1;display:flex;flex-direction:column;gap:16px}
.wire .w{background:var(--wireBox);border-radius:14px;position:relative}
.wire .w.f{background:var(--focusBg);outline:3px solid var(--accent2);outline-offset:-3px}
.wire .w.f b{position:absolute;left:14px;top:12px;padding:5px 12px;border-radius:999px;background:var(--accent2);color:var(--onAccent2);font:700 14px sans-serif}
.scan{position:absolute;top:-20px;bottom:-20px;width:4px;border-radius:2px;background:var(--accent2);box-shadow:0 0 24px var(--accent2);z-index:4}
.gray{position:absolute;top:0;bottom:0;right:0;backdrop-filter:grayscale(1);-webkit-backdrop-filter:grayscale(1);z-index:3;border-radius:0 var(--cr) var(--cr) 0}
.badge{position:absolute;top:-16px;right:-10px;padding:6px 14px;border-radius:999px;background:var(--accent2);color:var(--onAccent2);font:800 14px sans-serif;z-index:5;white-space:nowrap}
/* cover / section / checklist */
.cover{position:absolute;left:150px;top:300px;width:900px}
.kick{font:900 34px Inter;letter-spacing:.3em;color:var(--accentText)}
.ttl{font-weight:900;font-size:104px;line-height:1.15;margin-top:18px;letter-spacing:-.01em}
.chips{display:flex;gap:16px;margin-top:40px}
.chips span{padding:12px 26px;border-radius:999px;border:2px solid var(--line);font:700 26px sans-serif;color:var(--sub)}
.secno{font:900 220px/1 Inter;color:var(--accentText);letter-spacing:-.04em}
.sect{display:flex;align-items:center;gap:20px;font-weight:900;font-size:64px;margin-top:10px}
.sect i{width:7px;height:66px;background:var(--accent2);border-radius:4px}
.fan{position:absolute;width:1040px;height:680px}
.fan .fc{position:absolute;inset:0;transform-origin:50% 120%}
.ck{position:absolute;left:150px;top:300px;width:640px;padding:44px 48px;border-radius:30px;background:#111214;color:#fff;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.ck h4{font:600 24px sans-serif;color:#9a9aa2;margin-bottom:26px}
.ck div{display:flex;align-items:center;gap:20px;font:800 46px/1.6 sans-serif}
.ck b{width:18px;height:18px;border-radius:50%;flex:none}
.quote{position:absolute;left:180px;right:180px;top:300px}
.quote .q{font-weight:900;font-size:86px;line-height:1.3}
.quote .q em{font-style:normal;color:var(--accentText)}
.quote .by{margin-top:44px;font:600 30px sans-serif;color:var(--sub)}
.serif{font-family:Caladea,"Iowan Old Style",Georgia,"Noto Serif CJK SC","Songti SC",serif!important;font-style:italic}
</style></head><body><div id="root"></div>
