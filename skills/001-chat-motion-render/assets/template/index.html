<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聊天动效 · 四种界面，两种节奏</title><link rel="stylesheet" href="styles.css">
<nav id="controls"><strong>聊天动效库</strong><label>画幅 <select id="aspect"><option value="portrait">竖屏 9:16</option><option value="landscape">横屏 16:9</option></select></label><label>界面 <select id="theme"><option value="wechat">微信风格</option><option value="claude">Claude 风格</option><option value="chatgpt">ChatGPT 风格</option><option value="minimal">简洁卡片</option></select></label><label>动效 <select id="mode"><option value="type">逐字输入</option><option value="pop">泡泡弹出</option></select></label><label>内容 <select id="content"><option value="short">四条对话</option><option value="long">长对话 · 自动上移</option></select></label><button id="replay">重播</button><button id="pause">暂停</button><button id="edit">编辑对话</button></nav>
<div id="view"><main id="stage"><div class="kicker">CHAT MOTION / 02</div><div class="heading"><h1 id="style-title"></h1><span id="mode-title"></span></div><section class="chat"><header><span class="back">‹</span><span id="brand-icon"></span><div><strong id="brand-title"></strong><small id="status"></small></div><span class="menu">···</span></header><div id="clip"><div id="track"></div></div><footer><span id="input-placeholder"></span><span id="send">↑</span></footer></section><div class="note">界面风格演示 · 示例对话</div></main></div>
<div id="playback"><input id="scrub" type="range" min="0" step="0.01"><output id="clock"></output></div>
<dialog id="editor"><h2>每行一条消息</h2><p>用“我：”或“对方：”开头。输入框中保留换行分隔。</p><textarea id="script" rows="10"></textarea><div><button id="apply">应用并重播</button><button id="close">取消</button></div></dialog>
<script src="dialogue.js"></script><script src="engine.js"></script></html>
